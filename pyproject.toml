[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secgen"
version = "2.0.0"
description = "A comprehensive tool for generating ECS-compliant security data for Elasticsearch/Kibana"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "SecGen Contributors"}
]
keywords = [
    "elasticsearch",
    "kibana", 
    "security",
    "alerts",
    "testing",
    "ecs",
    "siem",
    "detection",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.1",
    "google-genai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "black>=24.0",
    "mypy>=1.8",
    "ruff>=0.3.0",
    "types-requests>=2.31",
    "types-PyYAML>=6.0",
]

[project.scripts]
secgen = "secgen.cli:main"

[project.urls]
Homepage = "https://github.com/enriquesanchez-elastic/alert-generator"
Documentation = "https://github.com/enriquesanchez-elastic/alert-generator#readme"
Repository = "https://github.com/enriquesanchez-elastic/alert-generator"
Issues = "https://github.com/enriquesanchez-elastic/alert-generator/issues"

[tool.hatch.build.targets.wheel]
packages = ["secgen"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]  # Line length handled by formatter

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--strict-markers",
    "--tb=short",
]

[tool.coverage.run]
source = ["secgen"]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
